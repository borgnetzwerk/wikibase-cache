# Example of config.local.yaml. Do not copy by hand: `python -m wikibase_cache setup` and `add-target` write the
# real file after asking you and checking with the server. config.local.yaml is never committed.

operator:
  name: "YourNameOrOrganisationBot"     # you are the client making the requests; no spaces
  contact: "https://example.org"        # a URL (preferred) or an e-mail address

# Absolute folder outside this repository; one subfolder per target. It can grow to gigabytes.
# Common choices: %LOCALAPPDATA%/wikibase-cache (Windows), ~/.local/share/wikibase-cache (Linux, macOS),
# or a folder of a sync service shared by several machines (the store is built for that).
data_root: "~/.local/share/wikibase-cache"

machine_id: "a1b2c3"                    # generated by setup; names this machine's event files
# env_file: "/home/me/.config/wikibase-cache.env"   # optional: secrets as NAME=value lines; outside the
                                       # repository and the data root; environment variables take precedence

targets:
  # Example: Wikidata, read without login. Added with
  #   python -m wikibase_cache add-target wikidata --api https://www.wikidata.org/w/api.php
  #       --sparql https://query.wikidata.org/sparql --languages de,en,mul
  wikidata:
    api: "https://www.wikidata.org/w/api.php"
    sparql: "https://query.wikidata.org/sparql"
    languages: [de, en, mul]                              # for basic_fetch
    namespaces: {item: 0, property: 120, lexeme: 146}   # detected by add-target
    auth: {method: none}

  # Example: a small Wikibase that requires login, read with an OAuth 2.0 owner-only consumer token. Added with
  #   python -m wikibase_cache add-target mywiki --api https://mywiki.example.org/w/api.php
  #       --auth oauth2 --token-env MYWIKI_TOKEN --full-sync
  mywiki:
    api: "https://mywiki.example.org/w/api.php"
    namespaces: {item: 120, property: 122}
    auth: {method: oauth2, token_env: MYWIKI_TOKEN, account: "ExampleBot"}   # account detected by add-target
    full_sync: true

  # Example: login with a bot password (Special:BotPasswords). Added with
  #   python -m wikibase_cache add-target otherwiki --api https://otherwiki.example.org/w/api.php
  #       --auth botpassword --username-env OTHERWIKI_USER --password-env OTHERWIKI_PASSWORD
  otherwiki:
    api: "https://otherwiki.example.org/w/api.php"
    namespaces: {item: 120, property: 122}
    auth: {method: botpassword, username_env: OTHERWIKI_USER, password_env: OTHERWIKI_PASSWORD, account: "Example"}
